[package]
name = "background_gif"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["gif"] }
rfd = "0.17.2"
slint = { version = "1", features = ["unstable-winit-030", "live-preview"] }

[build-dependencies]
slint-build = "1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }
